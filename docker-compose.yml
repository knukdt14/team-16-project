# docker-compose.yml
#
# 실행:  docker compose up --build
#   - 백엔드  http://localhost:8000  (API 문서 /docs)
#   - 프론트  http://localhost:3000
#
# 모델 전환:
#   기본값은 Codespaces 등 저사양 환경 기준(1.5B).
#   로컬 시연 시에는 아래 LLM_MODEL 을 3B 로 바꾸거나
#   `LLM_MODEL=Qwen/Qwen2.5-3B-Instruct docker compose up` 으로 실행.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ev-backend
    ports:
      - "8000:8000"
    environment:
      # LLM 프로바이더. 키가 없으면 자동으로 HuggingFace 로 동작한다.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      UPSTAGE_MODEL: ${UPSTAGE_MODEL:-solar-pro4}
      UPSTAGE_REASONING: ${UPSTAGE_REASONING:-minimal}
      UPSTAGE_MAX_TOKENS: ${UPSTAGE_MAX_TOKENS:-8000}
      UPSTAGE_TIMEOUT: ${UPSTAGE_TIMEOUT:-120}
      # 폴백용 로컬 모델. 저사양 환경 기본값(1.5B)
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-300}
      HF_HOME: /models
    volumes:
      # 데이터는 호스트와 공유 (인덱스 재생성 결과가 남도록)
      - ./data:/app/data
      # 모델 캐시. 컨테이너를 다시 만들어도 재다운로드하지 않음
      - hf-cache:/models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ev-frontend
    ports:
      - "3000:3000"
    environment:
      # 브라우저가 접속하는 백엔드 주소 (호스트 기준). Next 는 NEXT_PUBLIC_ 값을
      # 빌드시 사용하며, 미설정 시 lib/api.js 가 http://localhost:8000 으로 폴백.
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  hf-cache: