# docker-compose.yml
#
# 실행:  docker compose up --build
#   - 백엔드      http://localhost:8000  (API 문서 /docs)
#   - Streamlit  http://localhost:8501
#   - Next.js    http://localhost:3000

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ev-backend
    ports:
      - "8000:8000"
    environment:
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-300}
      HF_HOME: /models
    volumes:
      - ./data:/app/data
      - hf-cache:/models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ev-frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  frontend-next:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile
    container_name: ev-frontend-next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  hf-cache: